# Makes this repository public at 9:00 am Pacific on 2 November 2026, then
# deletes the token it used and switches itself off.
name: Make repository public

on:
  schedule:
    - cron: "0 17 2 11 *"   # 17:00 UTC = 9:00 am Pacific Standard Time

permissions: {}

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unless the date is 2 November 2026
        run: test "$(date -u +%F)" = 2026-11-02

      - name: Make the repository public
        env:
          GH_TOKEN: ${{ secrets.VISIBILITY_TOKEN }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY" -F private=false --jq .visibility | grep -x public

      - name: Delete the token and switch this workflow off
        env:
          GH_TOKEN: ${{ secrets.VISIBILITY_TOKEN }}
        run: |
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/secrets/VISIBILITY_TOKEN"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/make_repository_public.yml/disable"
